<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Route 6 GPS Probability Tracker by Ramin</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #151d2a;
      --accent: #38bdf8;
      --text: #f8fafc;
      --parkside: #22c55e;
      --mall: #ef4444;
      --warning: #f59e0b;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.6);
    }

    .header {
      text-align: center;
      border-bottom: 1px solid #273549;
      padding-bottom: 12px;
      margin-bottom: 16px;
    }

    .header h1 {
      font-size: 1.3rem;
      color: var(--accent);
      margin: 0;
    }

    .byline {
      margin: 4px 0 0;
      color: #94a3b8;
      font-size: 0.8rem;
    }

    .status-badge {
      display: inline-block;
      margin-top: 6px;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: bold;
      background: #273549;
      color: #94a3b8;
    }

    .badge-active {
      background: rgba(34, 197, 94, 0.2);
      color: var(--parkside);
      border: 1px solid var(--parkside);
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }

    .metric-box {
      background: #0f172a;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #273549;
      text-align: center;
    }

    .metric-label {
      font-size: 0.75rem;
      color: #94a3b8;
      text-transform: uppercase;
      font-weight: bold;
    }

    .metric-value {
      font-size: 1.4rem;
      font-weight: 800;
      margin-top: 4px;
      color: #fff;
    }

    .result-card {
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      margin-top: 10px;
      transition: all 0.3s ease;
    }

    .parkside-win {
      background: rgba(34, 197, 94, 0.15);
      border: 2px solid var(--parkside);
      color: #4ade80;
    }

    .mall-win {
      background: rgba(239, 68, 68, 0.15);
      border: 2px solid var(--mall);
      color: #f87171;
    }

    .prob-number {
      font-size: 3rem;
      font-weight: 900;
      line-height: 1;
      margin: 10px 0;
    }

    .details {
      font-size: 0.85rem;
      color: #cbd5e1;
      line-height: 1.4;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: var(--accent);
      color: #0f172a;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 16px;
    }

    button:disabled {
      background: #334155;
      color: #64748b;
    }

    .mode-buttons {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .mode-buttons button {
      flex: 1;
      margin-top: 0;
      padding: 12px;
      color: #fff;
      border-radius: 8px;
    }

    #breakBtn {
      background-color: #f39c12;
    }

    #depotBtn {
      background-color: #8e44ad;
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="header">
      <h1>🛰️ Live Route 6 GPS Simulator</h1>
      <p class="byline">by Ramin</p>
      <span id="gpsBadge" class="status-badge">GPS Standby</span>
    </div>

    <div class="grid">
      <div class="metric-box">
        <div class="metric-label">Active Trip</div>
        <div style="display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 4px;">
          <button type="button" onclick="adjustTrip(-1)"
            style="width: auto; padding: 2px 8px; margin: 0; background: #334155; font-size: 0.8rem;">◀</button>
          <div id="activeTrip" class="metric-value" style="margin: 0;">Trip --</div>
          <button type="button" onclick="adjustTrip(1)"
            style="width: auto; padding: 2px 8px; margin: 0; background: #334155; font-size: 0.8rem;">▶</button>
        </div>
      </div>
      <div class="metric-box">
        <div class="metric-label">Live Delay</div>
        <div id="liveDelay" class="metric-value">+0 min</div>
      </div>
    </div>

    <div class="grid">
      <div class="metric-box">
        <div class="metric-label">Nearest Stop</div>
        <div id="nearestZone" class="metric-value" style="font-size: 1rem; margin-top: 8px;">Locating...</div>
      </div>
      <div class="metric-box">
        <div class="metric-label">Current Speed</div>
        <div id="speed" class="metric-value">0 mph</div>
      </div>
    </div>

    <div class="grid">
      <div class="metric-box">
        <div class="metric-label">Peak Speed</div>
        <div id="maxSpeed" class="metric-value" style="color: var(--accent);">0 mph</div>
      </div>
      <div class="metric-box">
        <div class="metric-label">Hard Brakes</div>
        <div id="hardBrakes" class="metric-value" style="color: #4ade80;">0</div>
      </div>
    </div>

    <div id="resultCard" class="result-card parkside-win">
      <div style="font-size: 0.85rem; font-weight: bold; text-transform: uppercase;">8:47 PM Parkside Finish Odds</div>
      <div id="probDisplay" class="prob-number">0%</div>
      <div id="detailText" class="details">Start live tracking to calculate real-time accumulation.</div>
    </div>

    <button id="startBtn" onclick="toggleTracking()">Start Live GPS Tracking</button>
    <div class="mode-buttons">
      <button id="breakBtn" type="button" onclick="toggleBreakMode()">⏸️ Pause for Break</button>
      <button id="depotBtn" type="button" onclick="toggleDepotMode()">🚌 Depot Return</button>
    </div>
    <div style="text-align: center; margin-top: 10px;">
      <button id="soundToggleBtn" type="button" onclick="toggleSound()"
        style="background: transparent; border: 1px solid #334155; color: #94a3b8; font-size: 0.8rem; padding: 6px 12px; margin: 0; width: auto; border-radius: 20px;">
        🔊 Sound Alerts: ON (Tap to Test)
      </button>
    </div>
  </div>

  <script>
    // Run 758 Timetable Coordinates and Timings
    const PARK_SIDE_COORDS = { lat: 39.0305, lng: -77.1085 }; // Parkside Cul-de-Sac
    const MALL_COORDS = { lat: 39.0252, lng: -77.1478 };      // Westfield Montgomery Mall
    const GROSVENOR_COORDS = { lat: 39.0229, lng: -77.1039 }; // Grosvenor Metro

    const run758 = [
      { trip: 1, dir: "EAST", lvTime: "13:00", arTime: "13:17", target: "Parkside" },
      { trip: 2, dir: "WEST", lvTime: "13:18", arTime: "13:37", target: "Mall" },
      { trip: 3, dir: "EAST", lvTime: "13:45", arTime: "14:02", target: "Parkside" },
      { trip: 4, dir: "WEST", lvTime: "14:03", arTime: "14:22", target: "Mall" },
      { trip: 5, dir: "EAST", lvTime: "14:30", arTime: "14:49", target: "Parkside" },
      { trip: 6, dir: "WEST", lvTime: "14:50", arTime: "15:12", target: "Mall" },
      { trip: 7, dir: "EAST", lvTime: "16:00", arTime: "16:19", target: "Parkside" },
      { trip: 8, dir: "WEST", lvTime: "16:20", arTime: "16:42", target: "Mall" },
      { trip: 9, dir: "EAST", lvTime: "16:45", arTime: "17:04", target: "Parkside" },
      { trip: 10, dir: "WEST", lvTime: "17:05", arTime: "17:27", target: "Mall" },
      { trip: 11, dir: "EAST", lvTime: "17:30", arTime: "17:49", target: "Parkside" },
      { trip: 12, dir: "WEST", lvTime: "17:50", arTime: "18:12", target: "Mall" },
      { trip: 13, dir: "EAST", lvTime: "18:15", arTime: "18:34", target: "Parkside" },
      { trip: 14, dir: "WEST", lvTime: "18:35", arTime: "18:55", target: "Mall" },
      { trip: 15, dir: "EAST", lvTime: "19:00", arTime: "19:17", target: "Parkside" },
      { trip: 16, dir: "WEST", lvTime: "19:18", arTime: "19:38", target: "Mall" },
      { trip: 17, dir: "EAST", lvTime: "19:45", arTime: "20:02", target: "Parkside" },
      { trip: 18, dir: "WEST", lvTime: "20:03", arTime: "20:23", target: "Mall" },
      { trip: 19, dir: "EAST", lvTime: "20:30", arTime: "20:47", target: "Parkside" }
    ];

    let watchId = null;
    let isTracking = false;
    let wakeLock = null;
    let isOnBreak = false;
    let isDepotBound = false;
    let lastSpeedMph = 0;
    let excludedDelayMs = 0;
    let delayPauseStartedAt = null;
    let manualTripIndex = null; // Allows driver to lock trip if delayed

    // ==========================================
    // 🔊 Synthesized Web Audio Chime Engine
    // ==========================================
    let audioCtx = null;
    let soundEnabled = true;
    let lastFinishOutcome = null; // Tracks 'parkside' vs 'mall'

    // Initialize Audio Context on user click (browser security requirement)
    function initAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    // Generates pure synthesized multi-tone chimes without external mp3s
    function playChime(type = 'parkside') {
      if (!soundEnabled) return;
      initAudioContext();
      if (!audioCtx) return;

      try {
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'parkside') {
          // 🔔 Upbeat double chime for Parkside (659Hz -> 880Hz)
          osc.type = 'sine';
          osc.frequency.setValueAtTime(659.25, now);         // Note E5
          osc.frequency.setValueAtTime(880.00, now + 0.15);   // Note A5
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.7);
          osc.start(now);
          osc.stop(now + 0.7);
        } else {
          // ⚠️ Descending tone if flipped back to Mall (440Hz -> 349Hz)
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(440.00, now);         // Note A4
          osc.frequency.setValueAtTime(349.23, now + 0.18);   // Note F4
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.7);
          osc.start(now);
          osc.stop(now + 0.7);
        }
      } catch (err) {
        console.warn("Audio alert error: " + err.message);
      }
    }

    // Test / Mute Toggle Handler
    function toggleSound() {
      initAudioContext();
      if (soundEnabled) {
        // Play a preview test chime
        playChime('parkside');
        const btn = document.getElementById('soundToggleBtn');
        btn.innerText = "🔊 Sound Alerts: ON (Chime Tested)";
        btn.style.borderColor = "var(--accent)";
        btn.style.color = "var(--accent)";
      }
    }

    function adjustTrip(delta) {
      const now = new Date();
      const currentMinutes = now.getHours() * 60 + now.getMinutes();

      if (manualTripIndex === null) {
        let autoIndex = run758.findIndex(t => {
          const [h, m] = t.lvTime.split(':').map(Number);
          return (h * 60 + m) > currentMinutes;
        });
        if (autoIndex === -1) autoIndex = run758.length;
        manualTripIndex = Math.max(0, autoIndex - 1);
      }

      manualTripIndex = Math.max(0, Math.min(run758.length - 1, manualTripIndex + delta));
      const currentTrip = run758[manualTripIndex];
      document.getElementById('activeTrip').innerText = `Trip ${currentTrip.trip}`;
      calculatePrediction(currentTrip, lastSpeedMph, "Manual Adjustment");
    }

    function syncDelayPauseState(isPaused, now = Date.now()) {
      if (isPaused && delayPauseStartedAt === null) {
        delayPauseStartedAt = now;
      } else if (!isPaused && delayPauseStartedAt !== null) {
        excludedDelayMs += now - delayPauseStartedAt;
        delayPauseStartedAt = null;
      }
    }

    function getExcludedDelayMs(now = Date.now()) {
      return excludedDelayMs + (delayPauseStartedAt === null ? 0 : now - delayPauseStartedAt);
    }

    function updateModeStatus() {
      const gpsBadge = document.getElementById('gpsBadge');
      if (!isTracking) return;

      gpsBadge.innerText = isOnBreak
        ? 'GPS Active (Meal Break)'
        : isDepotBound
          ? 'GPS Active (Depot Return)'
          : 'GPS Active (Awake)';
    }

    function toggleBreakMode() {
      isOnBreak = !isOnBreak;
      const breakBtn = document.getElementById('breakBtn');
      breakBtn.innerText = isOnBreak ? '▶️ Resume Active Run' : '⏸️ Pause for Break';
      breakBtn.style.backgroundColor = isOnBreak ? '#27ae60' : '#f39c12';
      syncDelayPauseState(isOnBreak || isDepotBound); // FIXED: Removed speedMph === 0
      updateModeStatus();
    }

    function toggleDepotMode() {
      isDepotBound = !isDepotBound;
      const depotBtn = document.getElementById('depotBtn');
      depotBtn.innerText = isDepotBound ? '🔄 Back on Route' : '🚌 Depot Return';
      depotBtn.style.backgroundColor = isDepotBound ? '#2980b9' : '#8e44ad';
      syncDelayPauseState(isOnBreak || isDepotBound); // FIXED: Removed speedMph === 0
      if (isDepotBound) {
        document.getElementById('activeTrip').innerText = 'Deadhead (Depot)';
      }
      updateModeStatus();
    }

    // Function to request Screen Wake Lock
    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
          console.log('Screen Wake Lock is active!');

          // Re-apply wake lock if tab visibility changes
          document.addEventListener('visibilitychange', async () => {
            if (wakeLock !== null && document.visibilityState === 'visible') {
              wakeLock = await navigator.wakeLock.request('screen');
            }
          });
        }
      } catch (err) {
        console.warn(`Wake Lock Error: ${err.name}, ${err.message}`);
      }
    }

    // Function to release Screen Wake Lock
    function releaseWakeLock() {
      if (wakeLock !== null) {
        wakeLock.release()
          .then(() => {
            wakeLock = null;
            console.log('Screen Wake Lock released.');
          });
      }
    }

    async function toggleTracking() {
      if (!isTracking) {
        initAudioContext();
        if ("geolocation" in navigator) {
          excludedDelayMs = 0;
          delayPauseStartedAt = null;
          lastSpeedMph = 0;
          // 1. Activate GPS Tracking
          watchId = navigator.geolocation.watchPosition(handleGpsSuccess, handleGpsError, {
            enableHighAccuracy: true,
            maximumAge: 5000,
            timeout: 15000
          });

          // 2. Prevent Display / CPU from Sleeping
          await requestWakeLock();

          isTracking = true;
          document.getElementById('startBtn').innerText = "Stop Live Tracking";
          document.getElementById('gpsBadge').className = "status-badge badge-active";
          updateModeStatus();
        } else {
          alert("Geolocation is not supported by your browser.");
        }
      } else {
        // Stop GPS
        navigator.geolocation.clearWatch(watchId);

        // Release Wake Lock
        releaseWakeLock();

        isTracking = false;
        document.getElementById('startBtn').innerText = "Start Live GPS Tracking";
        document.getElementById('gpsBadge').className = "status-badge";
        document.getElementById('gpsBadge').innerText = "GPS Standby";
      }
    }

    function handleGpsSuccess(position) {
      const lat = position.coords.latitude;
      const lng = position.coords.longitude;
      const speedMph = Math.round((position.coords.speed || 0) * 2.23694);
      lastSpeedMph = speedMph;

      document.getElementById('speed').innerText = `${speedMph} mph`;

      // Calculate distance to terminal stops
      const distMall = getDistanceMeters(lat, lng, MALL_COORDS.lat, MALL_COORDS.lng);
      const distParkside = getDistanceMeters(lat, lng, PARK_SIDE_COORDS.lat, PARK_SIDE_COORDS.lng);

      let nearest = "En Route";
      if (distMall < 300) nearest = "Montgomery Mall";
      else if (distParkside < 300) nearest = "Parkside";
      document.getElementById('nearestZone').innerText = nearest;

      // Determine active trip based on current time
      const now = new Date();
      const currentMinutes = now.getHours() * 60 + now.getMinutes();

      const SHIFT_START_MINS = 13 * 60;       // 1:00 PM (780 mins)
      const SHIFT_END_MINS = 20 * 60 + 47;    // 8:47 PM (1247 mins)

      // 🏁 OFF-DUTY CHECK: If outside shift hours and driver hasn't manually selected a trip
      if (manualTripIndex === null) {
        if (currentMinutes < SHIFT_START_MINS) {
          document.getElementById('activeTrip').innerText = "Standby (1:00 PM)";
          document.getElementById('liveDelay').innerText = "Off Duty";
          const card = document.getElementById('resultCard');
          card.className = "result-card";
          card.style.borderColor = "#334155";
          card.style.background = "#0f172a";
          card.style.color = "#94a3b8";
          document.getElementById('probDisplay').innerText = "--";
          document.getElementById('detailText').innerHTML =
            `<strong>Shift Not Started</strong><br>` +
            `Run 758 begins at 1:00 PM from Montgomery Mall.<br>` +
            `<em>(Use ◀ ▶ arrows above to test/simulate any trip)</em>`;
          return;
        } else if (currentMinutes > SHIFT_END_MINS) {
          document.getElementById('activeTrip').innerText = "Shift Complete 🏁";
          document.getElementById('liveDelay').innerText = "Off Duty";
          const card = document.getElementById('resultCard');
          card.className = "result-card parkside-win";
          document.getElementById('probDisplay').innerText = "100%";
          document.getElementById('detailText').innerHTML =
            `<strong>Run 758 Complete!</strong><br>` +
            `Scheduled shift concluded at 8:47 PM. Great driving today!<br>` +
            `<em>(Use ◀ ▶ arrows above to test/simulate any trip)</em>`;
          return;
        }
      }

      // Active shift logic
      let currentTrip;
      if (manualTripIndex !== null) {
        currentTrip = run758[manualTripIndex];
      } else {
        let activeTripIndex = run758.findIndex(t => {
          const [h, m] = t.lvTime.split(':').map(Number);
          return (h * 60 + m) > currentMinutes;
        });
        if (activeTripIndex === -1) activeTripIndex = run758.length;
        currentTrip = run758[Math.max(0, activeTripIndex - 1)];
      }

      if (!isDepotBound) {
        document.getElementById('activeTrip').innerText = `Trip ${currentTrip.trip}`;
      }

      // Calculate prediction even when stopped at a red light/terminal!
      if (!isOnBreak && !isDepotBound) {
        calculatePrediction(currentTrip, speedMph, nearest);
      }
    }

    function calculatePrediction(currentTrip, speedMph, nearest) {
      const now = new Date();
      const currentMinutes = now.getHours() * 60 + now.getMinutes();

      const [schH, schM] = currentTrip.lvTime.split(':').map(Number);
      const scheduledDepartureMins = schH * 60 + schM;

      // Real delay in minutes (excluding meal break / depot pause)
      const liveDelayMins = Math.max(
        0,
        Math.round(currentMinutes - scheduledDepartureMins - (getExcludedDelayMs() / 60000))
      );
      document.getElementById('liveDelay').innerText = `+${liveDelayMins} min`;

      // Projection logic
      const tripsRemaining = Math.max(1, 19 - currentTrip.trip + 1);
      const projectedDelay = liveDelayMins + (tripsRemaining * 2.5); // 2.5 min expected delay per remaining leg

      const probability = Math.min(99, Math.max(5, Math.round((projectedDelay / 15) * 65)));
      const card = document.getElementById('resultCard');
      const probDisplay = document.getElementById('probDisplay');
      const detailText = document.getElementById('detailText');

      probDisplay.innerText = `${probability}%`;

      const currentOutcome = (projectedDelay >= 15) ? 'parkside' : 'mall';
      if (lastFinishOutcome !== null && currentOutcome !== lastFinishOutcome) {
        playChime(currentOutcome);
      }
      lastFinishOutcome = currentOutcome;

      if (projectedDelay >= 15) {
        card.className = "result-card parkside-win";
        detailText.innerHTML = `<strong>Likely Finish: Parkside Cul-de-Sac (8:47 PM Target)</strong><br>` +
          `Projected Accumulation: +${Math.round(projectedDelay)} mins<br>` +
          `Live GPS detected near ${nearest}.`;
      } else {
        card.className = "result-card mall-win";
        detailText.innerHTML = `<strong>Likely Finish: Montgomery Mall</strong><br>` +
          `Projected Accumulation: +${Math.round(projectedDelay)} mins<br>` +
          `Delay buffer is currently below the 15-minute threshold.`;
      }
    }

    function handleGpsError(error) {
      console.warn("GPS Error: " + error.message);
      document.getElementById('gpsBadge').innerText = "GPS Error";
    }

    function getDistanceMeters(lat1, lon1, lat2, lon2) {
      const R = 6371e3;
      const φ1 = lat1 * Math.PI / 180;
      const φ2 = lat2 * Math.PI / 180;
      const Δφ = (lat2 - lat1) * Math.PI / 180;
      const Δλ = (lon2 - lon1) * Math.PI / 180;

      const a = Math.sin(Δφ / 2) * Math.sin(Δφ / 2) +
        Math.cos(φ1) * Math.cos(φ2) *
        Math.sin(Δλ / 2) * Math.sin(Δλ / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));

      return R * c;
    }
  </script>

</body>
